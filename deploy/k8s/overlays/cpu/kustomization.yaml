# The model server on the CPU.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: model-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: model-server
      spec:
        template:
          spec:
            containers:
              - name: model-server
                env:
                  - name: CODEFORCES_DEVICE
                    value: cpu
