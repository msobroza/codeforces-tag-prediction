apiVersion: v1
kind: Service
metadata:
  name: model-server
  labels:
    app.kubernetes.io/name: model-server
spec:
  # Inside the cluster only: the model server has no authentication (kubectl port-forward
  # reaches it).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
